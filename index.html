<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crisis Council – The Sustainability RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f1e;--panel:#161a33;--line:#2c3366;--text:#eef0ff;--muted:#9aa1d0;--yield:#f5b83d;--image:#ff6fa5;--impact:#46e39a;--audit:#6fb7ff;--bad:#ff5a5a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05060c;color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
button{font:inherit;cursor:pointer}
.t-yield{color:var(--yield)}.t-image{color:var(--image)}.t-impact{color:var(--impact)}.t-audit{color:var(--audit)}

#stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;container-type:inline-size;overflow:hidden;user-select:none;
  background:repeating-conic-gradient(#1a1d38 0 25%,#171a32 0 50%) 0 0/5cqw 5cqw}
.wall{position:absolute;left:0;right:0;top:0;height:27%;background:linear-gradient(#232a5e,#161a3a);border-bottom:.6cqw solid #2c3366}
.wall::before{content:"";position:absolute;left:30%;right:30%;top:0;height:100%;background:repeating-linear-gradient(90deg,transparent 0 2.4cqw,rgba(255,255,255,.025) 2.4cqw 2.6cqw)}
.quest{position:absolute;left:1.6%;top:3%;width:23%;background:rgba(8,10,24,.85);border:.3cqw solid var(--yield);border-radius:.6cqw;padding:.8cqw 1cqw;z-index:40}
.quest .bank{font-size:.95cqw;color:var(--muted)}
.quest .q{font-family:'Press Start 2P';font-size:1cqw;line-height:1.6;color:var(--yield);margin-top:.3cqw}
.quest .bar{display:flex;gap:.4cqw;margin-top:.6cqw}
.quest .bar i{flex:1;height:.6cqw;border-radius:.2cqw;background:#2c3366}
.quest .bar i.on{background:var(--yield)}
.screen{position:absolute;right:1.6%;top:3%;width:19%;height:19.5%;background:#05060f;border:.5cqw solid #333a6e;border-radius:.6cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5cqw;z-index:40}
.screen .cl{font-family:'Press Start 2P';font-size:2.6cqw;color:var(--impact)}
.screen .cl.warn{color:var(--yield)}.screen .cl.over{color:var(--bad);animation:blink 1s infinite}
.screen .cc{font-size:.95cqw;color:var(--muted)}
.bench{position:absolute;left:26%;width:48%;top:14.5%;height:10%;background:linear-gradient(#2d4382,#1b2853);border-radius:.8cqw .8cqw .3cqw .3cqw;border-top:.5cqw solid var(--audit);z-index:20;display:flex;justify-content:space-around;align-items:center;box-shadow:0 1cqw 2cqw rgba(0,0,0,.5)}
.bp{background:#f2eee3;color:#111;font-size:1cqw;font-weight:700;padding:.2cqw .7cqw;border-radius:.3cqw;border-bottom:.3cqw solid var(--audit);text-align:center;line-height:1.2}
.bp small{display:block;font-weight:400;font-size:.8cqw;color:#444}
.gavel{position:absolute;right:-1.4cqw;top:-2.3cqw;font-size:2.3cqw}
.table{position:absolute;left:21%;top:31%;width:58%;height:34%;border-radius:50%;z-index:5;
 background:radial-gradient(ellipse at 50% 35%,#8a5733,#5a321b 65%,#3f2312);
 box-shadow:0 1.3cqw 0 #2a170c,0 2.4cqw 3cqw rgba(0,0,0,.65),inset 0 0 0 .7cqw #9b6640,inset 0 0 0 1cqw #4a2a16}
.table::before{content:"";position:absolute;inset:16% 18%;border-radius:50%;border:.25cqw dashed rgba(255,220,170,.18)}
.folder{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%) rotate(-4deg);z-index:6;background:#e9d9a8;color:#3a2a10;border-radius:.4cqw;padding:.7cqw 1.2cqw;font-family:'Press Start 2P';font-size:.85cqw;line-height:1.6;box-shadow:.3cqw .3cqw 0 rgba(0,0,0,.4);text-align:center;cursor:pointer;transition:transform .2s}
.folder:hover{transform:translate(-50%,-50%) rotate(-2deg) scale(1.08)}
.folder em{display:block;font-style:normal;font-size:.7cqw;color:#a33}
.coins{position:absolute;transform:translate(-50%,-50%);z-index:7;display:flex;flex-direction:column-reverse;align-items:center}
.coins i{display:block;width:3cqw;height:1cqw;border-radius:50%;background:radial-gradient(#ffe48a,#d39a1d);border:.15cqw solid #8a5e05;margin-top:-.45cqw;animation:drop .4s ease}
@keyframes drop{from{transform:translateY(-3cqw);opacity:0}}
.coins b{font-family:'Press Start 2P';font-size:1.1cqw;margin-bottom:.5cqw;text-shadow:.2cqw .2cqw 0 #000}
.plant{position:absolute;font-size:3cqw;z-index:4}

/* figures */
.seat{position:absolute;transform:translate(-50%,-62%);width:10cqw;text-align:center;cursor:pointer;transition:opacity .3s}
.seat .chair{position:absolute;left:50%;top:-.6cqw;transform:translateX(-50%);width:8.4cqw;height:9cqw;border-radius:2.2cqw 2.2cqw .6cqw .6cqw;background:linear-gradient(#343a72,#20244a);border:.3cqw solid #0f1228}
.fig{position:relative;display:flex;flex-direction:column;align-items:center;animation:bob 3.2s ease-in-out infinite;transition:filter .3s}
.seat:nth-child(2n) .fig{animation-delay:-1.4s}
@keyframes bob{50%{transform:translateY(-.35cqw)}}
.seat:hover .fig{filter:brightness(1.2) drop-shadow(0 0 .8cqw #fff6)}
.head{position:relative;width:4.6cqw;height:4.6cqw;border-radius:50%;background:var(--skin);z-index:2;box-shadow:inset -.4cqw -.4cqw 0 rgba(0,0,0,.12)}
.head .eye{position:absolute;top:47%;width:.55cqw;height:.7cqw;border-radius:50%;background:#1b1b1b;animation:wink 5s infinite}
.head .eye.l{left:30%}.head .eye.r{right:30%}
@keyframes wink{0%,96%,100%{transform:scaleY(1)}98%{transform:scaleY(.1)}}
.head .mouth{position:absolute;left:50%;top:66%;width:1.4cqw;height:.7cqw;transform:translateX(-50%);border-bottom:.3cqw solid #7a3b2a;border-radius:0 0 1cqw 1cqw}
.talking .head .mouth{animation:mouth .18s infinite alternate}
@keyframes mouth{to{height:1.1cqw;border:.3cqw solid #7a3b2a;background:#5a1f15;border-radius:50%}}
.head .glasses{position:absolute;top:42%;left:20%;right:20%;height:1.3cqw;border:.25cqw solid #222;border-radius:.4cqw;background:linear-gradient(90deg,transparent 46%,#222 46% 54%,transparent 54%)}
.hair{position:absolute;background:var(--hair)}
.hair.short{left:-2%;right:-2%;top:-6%;height:42%;border-radius:2.4cqw 2.4cqw .6cqw .6cqw}
.hairback{position:absolute;left:50%;top:-.4cqw;transform:translateX(-50%);width:5.6cqw;height:5.4cqw;border-radius:2.8cqw 2.8cqw 1cqw 1cqw;background:var(--hair);z-index:1}
.hair.long-fringe{left:-2%;right:-2%;top:-8%;height:38%;border-radius:2.4cqw 2.4cqw 1.2cqw 1.2cqw}
.hair.bun{left:28%;width:44%;top:-30%;height:40%;border-radius:50%}
.body{position:relative;width:7.2cqw;height:4.6cqw;margin-top:-.5cqw;border-radius:2.6cqw 2.6cqw .8cqw .8cqw;background:var(--shirt);display:grid;place-items:center;font-size:1.9cqw;box-shadow:inset 0 -.6cqw 0 rgba(0,0,0,.2)}
.body::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);border-left:1cqw solid transparent;border-right:1cqw solid transparent;border-top:1.3cqw solid #f2eee3}
.plate{display:inline-block;margin-top:.35cqw;background:#f2eee3;color:#111;font-size:1cqw;font-weight:700;padding:.2cqw .7cqw;border-radius:.3cqw;border-bottom:.35cqw solid var(--shirt);white-space:nowrap;line-height:1.25;position:relative;z-index:3}
.plate small{display:block;font-weight:400;font-size:.8cqw;color:#444}
.seat.talking .fig{filter:drop-shadow(0 0 1.3cqw var(--shirt))}
.seat.dim{opacity:.4}
.seat.huddle-l .fig{animation:huddleL 1.6s ease-in-out infinite}
.seat.huddle-r .fig{animation:huddleR 1.6s ease-in-out infinite}
@keyframes huddleL{50%{transform:rotate(7deg) translateX(.4cqw)}}
@keyframes huddleR{50%{transform:rotate(-7deg) translateX(-.4cqw)}}
.react{position:absolute;bottom:calc(100% - 1cqw);left:50%;transform:translateX(-50%);font-size:2.3cqw;z-index:60;animation:popin .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:translateX(-50%) scale(0)}}
.spot{position:absolute;width:22cqw;height:22cqw;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(var(--c) 0,transparent 65%);opacity:.3;z-index:4;pointer-events:none;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.12}}
.alarm{position:absolute;inset:0;z-index:35;pointer-events:none;box-shadow:inset 0 0 8cqw rgba(255,40,40,.7);animation:blink .8s infinite}
.alarmtag{position:absolute;left:50%;top:27.5%;transform:translateX(-50%);z-index:36;background:var(--bad);color:#fff;font-family:'Press Start 2P';font-size:.9cqw;padding:.5cqw 1cqw;border-radius:.4cqw;animation:blink .8s infinite;white-space:nowrap}

/* speech bubble */
.speech{position:absolute;z-index:86;background:#fff;color:#111;font-size:1.2cqw;line-height:1.32;padding:.8cqw 1.1cqw;border-radius:1cqw;width:25cqw;box-shadow:0 .6cqw 2cqw rgba(0,0,0,.55);animation:pop .3s ease;transform:translateX(-50%);cursor:pointer}
.speech b{color:#b4580b}
.speech .who{display:block;font-family:'Press Start 2P';font-size:.7cqw;margin-bottom:.4cqw;color:var(--c)}
.speech.cap{border:.25cqw solid var(--c);text-align:center}
.speech.up::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:.9cqw solid transparent;border-top-color:#fff}
.speech.down::after{content:"";position:absolute;bottom:100%;left:var(--ax,50%);transform:translateX(-50%);border:.9cqw solid transparent;border-bottom-color:#fff}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(1cqw)}}

/* ===== CONSOLE ===== */
#console{position:absolute;left:1.2%;right:1.2%;bottom:1.6%;height:21.5%;z-index:95;background:rgba(10,12,30,.97);border:.35cqw solid #e9e6ff;border-radius:1cqw;box-shadow:0 0 0 .35cqw #0d0f1e,0 1cqw 3cqw rgba(0,0,0,.6);padding:.7cqw 1cqw;display:flex;flex-direction:column;gap:.55cqw}
.tabs{display:flex;gap:.35cqw;align-items:center}
.tab{font-family:'Press Start 2P';font-size:.72cqw;padding:.55cqw .65cqw;border-radius:.4cqw;background:#161a33;border:.15cqw solid #2c3366;color:#9aa1d0;white-space:nowrap}
.tab:hover{border-color:var(--yield);color:var(--text)}
.tab.on{background:var(--yield);color:#0d0f1e;border-color:var(--yield)}
.util{margin-left:auto;display:flex;gap:.35cqw}
.util button{background:#161a33;border:.15cqw solid #2c3366;color:var(--text);border-radius:.35cqw;font-size:.95cqw;padding:.3cqw .55cqw;white-space:nowrap}
.util button:hover{border-color:var(--audit)}
.cue{font-size:.95cqw;color:var(--muted);display:flex;align-items:center;gap:.6cqw}
.cue b{color:var(--yield);font-family:'Press Start 2P';font-size:.7cqw}
.acts{display:flex;flex-wrap:wrap;gap:.45cqw .5cqw;align-content:flex-start;flex:1;overflow:auto}
.grp{display:flex;align-items:center;gap:.4cqw;padding-right:.7cqw;margin-right:.2cqw;border-right:.15cqw solid #2c3366}
.grp:last-child{border-right:none}
.gl{font-family:'Press Start 2P';font-size:.62cqw;color:var(--muted)}
.act{font-size:1cqw;font-weight:700;padding:.4cqw .7cqw;border-radius:.45cqw;background:#1d2244;border:.2cqw solid var(--c,#6fb7ff);color:var(--text);white-space:nowrap}
.act:hover{background:var(--c,#6fb7ff);color:#0d0f1e}
.act.on{background:var(--c,#6fb7ff);color:#0d0f1e}
.act.done{opacity:.4}
.act:disabled{opacity:.3;cursor:not-allowed;background:#1d2244;color:var(--text)}
.vnum{font-family:'Press Start 2P';font-size:1cqw;min-width:1.6cqw;text-align:center}

/* ===== PORTFOLIO ===== */
.pfwrap{position:absolute;left:0;right:0;top:0;bottom:24.5%;z-index:90;display:flex;align-items:center;justify-content:center;background:rgba(5,6,15,.55)}
.pfwrap.opening{animation:fadein .3s ease}
@keyframes fadein{from{opacity:0}}
.pf{position:relative;width:76cqw;height:36cqw;background:linear-gradient(135deg,#5c3417,#3b200e);border-radius:1.2cqw;padding:1.2cqw;box-shadow:0 2cqw 4cqw rgba(0,0,0,.7),inset 0 0 0 .3cqw #7a4a24;display:flex;gap:0}
.pf.opening{animation:openpf .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes openpf{from{transform:scale(.3) rotate(-6deg);opacity:0}}
.page{flex:1;background:#f4efe1;color:#1d1a14;padding:2cqw 2.4cqw;position:relative;overflow:hidden;
 background-image:repeating-linear-gradient(0deg,transparent 0 2.3cqw,rgba(70,90,160,.09) 2.3cqw 2.4cqw)}
.page.l{border-radius:.6cqw 0 0 .6cqw;box-shadow:inset -1.5cqw 0 2cqw -1cqw rgba(0,0,0,.25)}
.page.r{border-radius:0 .6cqw .6cqw 0;box-shadow:inset 1.5cqw 0 2cqw -1cqw rgba(0,0,0,.25)}
.rings{position:absolute;left:50%;top:10%;bottom:10%;width:2cqw;transform:translateX(-50%);display:flex;flex-direction:column;justify-content:space-around;z-index:3}
.rings i{display:block;width:2cqw;height:1cqw;border-radius:1cqw;border:.35cqw solid #b8b8c4;background:#8b8b96}
.ptabs{position:absolute;right:-6.2cqw;top:2cqw;display:flex;flex-direction:column;gap:.4cqw}
.ptab{width:7cqw;padding:.6cqw .3cqw .6cqw 1cqw;border-radius:0 .5cqw .5cqw 0;border:none;font-size:.8cqw;font-weight:700;color:#1d1a14;text-align:left;box-shadow:.2cqw .2cqw 0 rgba(0,0,0,.3)}
.ptab.on{transform:translateX(.6cqw)}
.pfclose{position:absolute;right:-1.2cqw;top:-1.2cqw;width:3cqw;height:3cqw;border-radius:50%;border:.25cqw solid #fff;background:var(--bad);color:#fff;font-size:1.3cqw;z-index:5}
.pnav{position:absolute;bottom:1cqw;display:flex;gap:.5cqw}
.pnav button{background:#1d1a14;color:#f4efe1;border:none;border-radius:.4cqw;padding:.4cqw .9cqw;font-size:1cqw;font-weight:700}
.pnav button:disabled{opacity:.25}
.kicker{font-family:'Press Start 2P';font-size:.75cqw;color:#9b2c2c;letter-spacing:.1cqw}
.ph1{font-size:2.4cqw;font-weight:700;line-height:1.1;margin:.6cqw 0 1cqw}
.ptxt{font-size:1.35cqw;line-height:1.45}
.pstamp{display:inline-block;font-family:'Press Start 2P';font-size:1cqw;color:#b22;border:.3cqw solid #b22;padding:.6cqw .9cqw;transform:rotate(-8deg);opacity:.85;margin-top:1cqw}
.illu{font-size:9cqw;text-align:center;line-height:1;margin-top:1cqw;filter:drop-shadow(.4cqw .4cqw 0 rgba(0,0,0,.15))}
.clip{position:absolute;top:-1cqw;left:3cqw;width:2cqw;height:6cqw;border:.35cqw solid #9aa;border-radius:1cqw;z-index:4}
.factgrid{display:grid;grid-template-columns:1fr 1fr;gap:.9cqw}
.fact{background:#fff;border:.15cqw solid #d8cfb5;border-left:.6cqw solid #c58b2a;border-radius:.4cqw;padding:.8cqw 1cqw;box-shadow:.2cqw .2cqw 0 rgba(0,0,0,.08)}
.fact small{display:block;font-size:.85cqw;color:#7a6a4a;text-transform:uppercase;letter-spacing:.1cqw}
.fact b{font-size:1.35cqw}
.stk{display:flex;align-items:center;gap:1cqw;padding:.55cqw 0;border-bottom:.12cqw dashed #cfc5a8;font-size:1.2cqw}
.stk .ic{font-size:2cqw;width:3cqw;text-align:center}
.breaking{background:#b31b1b;color:#fff;font-family:'Press Start 2P';font-size:.9cqw;padding:.6cqw 1cqw;border-radius:.3cqw;display:inline-block;animation:blink 1s infinite}
.ticker{margin-top:1cqw;background:#1d1a14;color:#ffd75a;font-size:1.1cqw;padding:.6cqw 1cqw;border-radius:.3cqw;white-space:nowrap;overflow:hidden}
.ticker span{display:inline-block;animation:tick 22s linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.goal{display:flex;gap:.8cqw;align-items:flex-start;margin:.7cqw 0;font-size:1.15cqw}
.goal .dot{flex:none;width:1.2cqw;height:1.2cqw;border-radius:.3cqw;margin-top:.3cqw}

/* ===== HOLO / ABILITY ===== */
.holo{position:absolute;left:24%;top:26%;width:52%;height:42%;z-index:79;background:linear-gradient(160deg,rgba(18,40,80,.94),rgba(10,16,40,.96));border:.3cqw solid var(--audit);border-radius:1cqw;box-shadow:0 0 3cqw rgba(111,183,255,.45);padding:1.4cqw 1.8cqw;animation:holo .5s ease;overflow:hidden}
.holo::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(111,183,255,.05) 0 .2cqw,transparent .2cqw .5cqw)}
@keyframes holo{from{transform:scaleY(.02);opacity:0}60%{transform:scaleY(1.04)}}
.htitle{font-family:'Press Start 2P';font-size:1cqw;color:var(--audit);margin-bottom:1.2cqw}
.meter{height:2.4cqw;background:#0d0f1e;border:.2cqw solid #2c3366;border-radius:.5cqw;position:relative;overflow:hidden}
.meter .zero{position:absolute;left:50%;top:0;bottom:0;width:.2cqw;background:var(--muted)}
.meter .fill{position:absolute;top:0;bottom:0;animation:grow 1.4s ease both}
@keyframes grow{from{clip-path:inset(0 50% 0 50%)}}
.mlbl{display:flex;justify-content:space-between;font-size:.9cqw;color:var(--muted);margin-top:.3cqw}
.bignum{font-family:'Press Start 2P';font-size:3cqw;text-align:center;margin:1.4cqw 0 .6cqw}
.news{position:absolute;left:50%;top:47%;width:44cqw;background:#f2eee3;color:#111;border-radius:.4cqw;padding:1.4cqw 1.8cqw;font-family:Georgia,serif;box-shadow:0 1.5cqw 3cqw rgba(0,0,0,.6);z-index:79;animation:spin .8s cubic-bezier(.2,1.2,.4,1) both;transform:translate(-50%,-50%) rotate(-3deg)}
@keyframes spin{from{transform:translate(-50%,-50%) rotate(-720deg) scale(.05)}}
.news small{font-family:'Space Grotesk';font-size:.85cqw;letter-spacing:.3cqw;color:#555;display:block;border-bottom:.2cqw solid #111;padding-bottom:.5cqw}
.news .hl{font-size:2.6cqw;font-weight:700;line-height:1.12;margin:.8cqw 0}
.news .sub{font-size:1.1cqw;color:#333}
.ecg{font-size:1.25cqw}
.ecg .r{display:flex;justify-content:space-between;padding:.55cqw 0;border-bottom:.15cqw dashed #2c3366;animation:popr .4s both}
.ecg .r.neg{color:var(--bad);font-weight:700}
.ecg .r.tot{font-size:1.9cqw;font-weight:700;border:none}
@keyframes popr{from{opacity:0;transform:translateX(-2cqw)}}
.warnbox{margin-top:.8cqw;background:rgba(255,90,90,.15);border:.2cqw solid var(--bad);border-radius:.5cqw;padding:.6cqw .8cqw;font-size:1.05cqw}
.stamp{position:absolute;left:50%;top:46%;z-index:79;font-family:'Press Start 2P';font-size:2.6cqw;line-height:1.5;text-align:center;padding:1.6cqw 2.4cqw;border:.6cqw solid currentColor;border-radius:1cqw;background:rgba(13,15,30,.88);transform:translate(-50%,-50%) rotate(-6deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;white-space:nowrap}
@keyframes stamp{from{transform:translate(-50%,-50%) scale(3) rotate(-20deg);opacity:0}}
.cmp{width:100%;border-collapse:collapse;font-size:1.1cqw}
.cmp th,.cmp td{padding:.6cqw;border-bottom:.15cqw solid #2c3366;text-align:left}
.cmp td.n{text-align:right;font-variant-numeric:tabular-nums}
.cmp tr.win{background:rgba(255,255,255,.06)}
.ability{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);z-index:88;width:34cqw;background:linear-gradient(160deg,#1d2244,#0d0f1e);border:.45cqw solid var(--c);border-radius:1.2cqw;padding:1.6cqw;text-align:center;box-shadow:0 0 4cqw var(--c);animation:abil .6s cubic-bezier(.2,1.6,.4,1);cursor:pointer}
@keyframes abil{from{transform:translate(-50%,-50%) rotateY(180deg) scale(.4);opacity:0}}
.ability .ak{font-family:'Press Start 2P';font-size:.9cqw;color:var(--c)}
.ability .an{font-family:'Press Start 2P';font-size:2cqw;color:#fff;margin:1cqw 0;text-shadow:0 0 1.5cqw var(--c)}
.ability p{font-size:1.3cqw;margin:0}
.ability .bolt{font-size:4cqw}

/* overlays */
.over{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(5,6,15,.72);backdrop-filter:blur(.3cqw)}
.titlebox{text-align:center}
.titlebox h1{font-family:'Press Start 2P';font-size:5cqw;color:var(--yield);text-shadow:.5cqw .5cqw 0 #5a2e00;margin:1cqw 0}
.titlebox .tag{font-family:'Press Start 2P';font-size:1.2cqw;color:var(--impact)}
.titlebox p{font-size:1.4cqw;color:var(--muted);max-width:60cqw;margin:1.6cqw auto}
.start{font-family:'Press Start 2P';font-size:1.6cqw;background:var(--yield);color:#0d0f1e;border:none;border-radius:.6cqw;padding:1.2cqw 2.4cqw;box-shadow:0 .5cqw 0 #8a5e05}
.sbtn{background:#1d2244;border:.2cqw solid #2c3366;color:var(--text);border-radius:.5cqw;padding:.7cqw 1.4cqw;font-size:1.2cqw;margin:0 .4cqw}
.sbtn:hover{border-color:var(--audit)}
.panelbox{background:#161a33;border:.3cqw solid #2c3366;border-radius:1cqw;padding:1.8cqw 2.2cqw;width:72cqw;max-height:90%;overflow:auto;font-size:1.25cqw}
.panelbox h2{font-family:'Press Start 2P';font-size:1.2cqw;color:var(--audit);margin:0 0 1.2cqw}
.panelbox h3{font-size:1.2cqw;margin:1.4cqw 0 .6cqw;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.8cqw}
.fgrid label{font-size:1cqw;color:var(--muted);display:flex;flex-direction:column;gap:.3cqw}
.panelbox input{background:#0d0f1e;border:.15cqw solid #2c3366;color:var(--text);border-radius:.4cqw;padding:.5cqw .7cqw;font:inherit;font-size:1.15cqw}
.prof{display:flex;gap:1.6cqw}
.prof .pp{flex:none;width:12cqw;height:14cqw;position:relative;border-radius:.8cqw;background:radial-gradient(circle at 50% 35%,#2c3366,#11142b);border:.3cqw solid var(--c);overflow:hidden}
.prof .pp .fig{position:absolute;left:50%;top:18%;transform:translateX(-50%) scale(1.5);transform-origin:top center;animation:none}
.lbl{font-family:'Press Start 2P';font-size:.85cqw;color:var(--muted);margin:1cqw 0 .3cqw}
.stat{display:grid;grid-template-columns:9cqw 1fr 2cqw;gap:.6cqw;align-items:center;font-size:1.05cqw;color:var(--muted);margin:.3cqw 0}
.sbar{height:.9cqw;background:#0d0f1e;border-radius:.2cqw;overflow:hidden}
.sbar i{display:block;height:100%}
.abil{border:.15cqw dashed var(--c);border-radius:.5cqw;padding:.6cqw .8cqw;margin-top:.8cqw}
ul.cl{margin:.2cqw 0;padding-left:1.6cqw} ul.cl li{margin:.2cqw 0}

/* ===== PORTFOLIO v3: illustrations + flip ===== */
.pf{perspective:220cqw}
.page{position:relative}
.pnav{position:absolute;left:50%;bottom:-3.6cqw;transform:translateX(-50%);display:flex;gap:1cqw;align-items:center;z-index:6}
.pnav span{color:#e9d9a8;font-size:1.1cqw;font-weight:700}
.pnav button{background:#e9d9a8;color:#1d1a14;border:none;border-radius:.4cqw;padding:.45cqw 1.1cqw;font-size:1.05cqw;font-weight:700}
.pnav button:disabled{opacity:.3}
.flipper{position:absolute;top:1.2cqw;bottom:1.2cqw;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.45,.05,.3,1);z-index:8}
.flipper.fwd{left:50%;right:1.2cqw;transform-origin:left center}
.flipper.bwd{left:1.2cqw;right:50%;transform-origin:right center}
.flipper.fwd.go{transform:rotateY(-180deg)}
.flipper.bwd.go{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.22),transparent 35%,transparent 70%,rgba(0,0,0,.1));animation:shade .8s ease}
@keyframes shade{50%{opacity:1}0%,100%{opacity:.3}}
.art{width:100%;height:auto;max-height:26cqw;display:block;border-radius:.6cqw;box-shadow:.3cqw .3cqw 0 rgba(0,0,0,.15)}
.caption{text-align:center;font-size:.95cqw;color:#6b5d40;margin-top:.7cqw;font-style:italic}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:.8cqw;margin-top:2.2cqw;font-size:1cqw;color:#6b5d40}
.meta div{background:#fff;border:.15cqw solid #d8cfb5;border-radius:.5cqw;padding:.7cqw;line-height:1.4}
.meta b{color:#1d1a14}
.bigq{margin-top:1.6cqw;font-size:1.6cqw;font-weight:700;background:#fff3c4;border:.2cqw dashed #c58b2a;border-radius:.6cqw;padding:.8cqw 1cqw;display:inline-block;transform:rotate(-1.5deg)}
.flow{display:grid;grid-template-columns:1fr 2cqw 1fr 2cqw 1fr;gap:.5cqw .2cqw;align-items:center;margin-top:1cqw}
.node{background:#fff;border:.18cqw solid #d8cfb5;border-radius:.7cqw;padding:.7cqw .4cqw;text-align:center;box-shadow:.2cqw .2cqw 0 rgba(0,0,0,.08);min-height:9cqw;display:flex;flex-direction:column;justify-content:center}
.node span{font-size:3.2cqw;line-height:1.1}
.node b{font-size:1cqw;line-height:1.2;margin-top:.3cqw}
.node small{font-size:.85cqw;color:#6b5d40}
.node.hi{border-color:#c58b2a;background:#fff8e1}
.arr{text-align:center;font-size:1.6cqw;color:#b4580b;font-weight:700}
.arr.down{font-size:1.8cqw}
.dots{display:grid;grid-template-columns:repeat(40,1fr);gap:.12cqw;margin-top:.8cqw;width:31cqw}
.dots i{display:block;aspect-ratio:1;border-radius:50%;background:#c58b2a}
.dots i:nth-child(odd){background:#d9a441}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.8cqw}
.tile{background:#fff;border:.15cqw solid #d8cfb5;border-radius:.6cqw;padding:.7cqw .9cqw;display:grid;grid-template-columns:3.4cqw 1fr;grid-template-rows:auto auto;column-gap:.6cqw;align-items:center;box-shadow:.2cqw .2cqw 0 rgba(0,0,0,.08)}
.tile span{grid-row:1/3;font-size:2.8cqw;text-align:center}
.tile b{font-size:1.25cqw;line-height:1.15}
.tile small{font-size:.9cqw;color:#6b5d40;line-height:1.2}
.smap{position:relative;width:100%;height:29cqw}
.smap svg{position:absolute;inset:0;width:100%;height:100%}
.smap line{stroke:#c58b2a;stroke-width:.5;stroke-dasharray:1.5 1.2}
.scenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:8cqw;height:8cqw;border-radius:50%;background:#1d1a14;color:#ffd75a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2.6cqw;box-shadow:0 0 0 .5cqw #e9d9a8}
.scenter b{font-size:.85cqw;text-align:center;line-height:1.1}
.snode{position:absolute;transform:translate(-50%,-50%);width:9.6cqw;background:#fff;border:.15cqw solid #d8cfb5;border-radius:.6cqw;padding:.4cqw;text-align:center;line-height:1.15;box-shadow:.2cqw .2cqw 0 rgba(0,0,0,.08)}
.snode span{display:block;font-size:2.2cqw}
.snode b{display:block;font-size:.95cqw}
.snode small{font-size:.8cqw;color:#6b5d40}
.protest{position:relative;height:30cqw;border-radius:.6cqw;overflow:hidden;background:linear-gradient(#a9cbe8 0 55%,#8a8170 55%)}
.hq{position:absolute;left:12%;right:12%;top:6%;height:48%;background:#d9d4c6;border:.3cqw solid #3b3326;border-bottom:none;display:grid;grid-template-columns:repeat(6,1fr);gap:.6cqw;padding:3.2cqw 1.2cqw 1cqw}
.hq i{background:#7fa7c9;border:.15cqw solid #3b3326}
.hqsign{position:absolute;top:.6cqw;left:50%;transform:translateX(-50%);background:#1d1a14;color:#ffd75a;font-family:'Press Start 2P';font-size:.8cqw;padding:.4cqw .8cqw}
.cam{position:absolute;right:3%;top:38%;font-size:3cqw;text-align:center}
.cam span{display:block;font-size:.8cqw;color:#fff;background:#d11;border-radius:.3cqw;padding:.1cqw .3cqw;font-weight:700;animation:blink 1s infinite}
.signs{position:absolute;left:4%;right:14%;top:47%;display:flex;justify-content:space-around}
.sign{font-size:.85cqw;font-weight:800;color:#1d1a14;text-align:center;line-height:1.15;padding:.5cqw .6cqw;border:.2cqw solid #1d1a14;border-radius:.2cqw;box-shadow:0 1.6cqw 0 -1.4cqw #6b4a2a;animation:wave 1.2s ease-in-out infinite alternate}
@keyframes wave{to{transform:rotate(5deg) translateY(-.4cqw)}}
.crowd{position:absolute;left:0;right:0;top:63%;text-align:center;font-size:2.5cqw;letter-spacing:-.5cqw;white-space:nowrap}
.phone{position:absolute;right:3%;bottom:3%;background:#fff;border-radius:.6cqw;padding:.5cqw .8cqw;font-size:.85cqw;box-shadow:0 .3cqw 1cqw rgba(0,0,0,.3);animation:buzz 2s infinite}
@keyframes buzz{0%,90%,100%{transform:none}92%{transform:translateX(.2cqw)}94%{transform:translateX(-.2cqw)}96%{transform:translateX(.2cqw)}}
.opts{display:flex;flex-direction:column;gap:.7cqw}
.opt{display:grid;grid-template-columns:3cqw 3.4cqw 1fr;gap:.8cqw;align-items:center;background:#fff;border:.2cqw solid var(--o);border-left:.7cqw solid var(--o);border-radius:.6cqw;padding:.6cqw .8cqw;box-shadow:.2cqw .2cqw 0 rgba(0,0,0,.08)}
.oL{width:3cqw;height:3cqw;border-radius:50%;background:var(--o);color:#1d1a14;font-family:'Press Start 2P';font-size:1.2cqw;display:grid;place-items:center;text-shadow:.15cqw .15cqw 0 rgba(0,0,0,.3)}
.oI{font-size:2.8cqw;text-align:center}
.opt b{font-size:1.12cqw;line-height:1.2}
.opt ul{margin:.25cqw 0 0;padding-left:1.1cqw;font-size:.86cqw;color:#4b4030;line-height:1.3}
.voters{display:flex;align-items:center;gap:.5cqw;margin-top:1.6cqw}
.voters span{width:3.2cqw;height:3.2cqw;border-radius:50%;display:grid;place-items:center;font-size:1.6cqw;border:.2cqw solid #1d1a14}
.voters b{font-size:2cqw;color:#b4580b;margin:0 .4cqw}
.voters em{font-style:normal;font-size:3.6cqw}
.coinlbl{font-family:'Press Start 2P';font-size:.9cqw}

@keyframes dotin{from{opacity:0}}

/* ===== LUCKY SPIN ===== */
.spinwrap{position:absolute;left:0;right:0;top:0;bottom:24.5%;z-index:90;display:flex;align-items:center;justify-content:center;gap:3cqw;background:rgba(5,6,15,.72);backdrop-filter:blur(.2cqw)}
.wheelbox{height:40cqw;width:40cqw;position:relative}
.wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 1.5cqw 2cqw rgba(0,0,0,.6))}
.wheelbox::before{content:"";position:absolute;inset:8%;border-radius:50%;box-shadow:0 0 4cqw rgba(255,215,90,.35)}
.board{width:30cqw;background:#161a33;border:.3cqw solid #2c3366;border-radius:1cqw;padding:1.4cqw 1.6cqw;display:flex;flex-direction:column;gap:.9cqw}
.bt{font-family:'Press Start 2P';font-size:1.3cqw;color:var(--yield)}
.bs{font-size:1.05cqw;color:var(--muted);line-height:1.4}
.tbox{border:.25cqw solid var(--c);border-radius:.7cqw;padding:.7cqw 1cqw;background:rgba(255,255,255,.03)}
.th{font-family:'Press Start 2P';font-size:.85cqw;color:var(--c)}
.tt{font-size:1cqw;color:var(--muted);margin:.25cqw 0 .5cqw}
.tm{display:flex;gap:.6cqw}
.tm span{flex:1;text-align:center;background:#0d0f1e;border:.18cqw dashed #2c3366;border-radius:.5cqw;padding:.45cqw;font-size:1.25cqw;font-weight:700;color:#55608f}
.tm span.in{background:var(--c);color:#0d0f1e;border:.18cqw solid var(--c);animation:popn .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes popn{from{transform:scale(0)}}

/* ===== JOIN / RATINGS on big screen ===== */
.jlist{display:flex;flex-wrap:wrap;gap:.5cqw}
.jlist span{font-size:1.05cqw;padding:.35cqw .7cqw;border-radius:.4cqw;background:#0d0f1e;border:.15cqw solid #2c3366;color:var(--muted)}
.jlist span.in{border-color:var(--impact);color:var(--text)}
.rrow{display:grid;grid-template-columns:1fr auto 5cqw;align-items:center;gap:1cqw;font-size:1.4cqw;padding:.7cqw 0;border-bottom:.15cqw dashed #2c3366}
.stars i{font-style:normal;font-size:2cqw;color:#2c3366;margin-right:.2cqw}
.stars i.on{color:#ffd75a;text-shadow:0 0 .8cqw rgba(255,215,90,.6)}
.plate .ph{font-size:.75cqw;margin-left:.2cqw}

/* ===== PHONE APP ===== */
#phone{display:none}
html.phonemode,body.phonemode{overflow:hidden;height:100%}
body.phonemode{display:block;background:#0d0f1e}
body.phonemode #stage{display:none}
body.phonemode #phone{display:block;position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;background:radial-gradient(circle at 20% 0%,#23285a,#0d0f1e 60%) fixed;font-size:16px;line-height:1.45}
#phone .pin{max-width:520px;margin:0 auto;padding:16px 14px 90px}
#phone button{font:inherit;cursor:pointer}
.ptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.plogo{font-family:'Press Start 2P';font-size:13px;line-height:1.6;color:var(--yield)}
.pill{font-size:13px;padding:4px 10px;border-radius:99px;background:#161a33;border:1px solid #2c3366;color:var(--muted)}
.pill.on{color:var(--impact);border-color:var(--impact)}
.pphase{background:#161a33;border:1px solid #2c3366;border-radius:10px;padding:8px 12px;font-size:14px;color:var(--muted);margin-bottom:12px}
.pphase b{color:var(--yield)}
.ph1x{font-family:'Press Start 2P';font-size:18px;line-height:1.5;margin:18px 0 6px}
.pmuted{color:var(--muted);font-size:14px}
.pnames{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.pnames button{background:#1d2244;border:2px solid #2c3366;color:var(--text);border-radius:12px;padding:16px 8px;font-size:17px;font-weight:700}
.pnames button:active{border-color:var(--yield)}
.pvis{width:100%;background:#1d2244;border:2px solid var(--audit);color:var(--text);border-radius:12px;padding:14px;font-size:16px;font-weight:700}
.pcard{background:#161a33;border:1px solid #2c3366;border-radius:14px;padding:14px 16px;margin:12px 0}
.pcard h2{margin:6px 0}
.pbig{font-size:54px;text-align:center}
.pteams{display:grid;gap:8px;margin-top:10px}
.pteams button{background:#1d2244;border:2px solid var(--c);color:var(--text);border-radius:10px;padding:12px;font-size:16px;font-weight:700}
.pteam{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--c),#161a33 75%);border-radius:16px;padding:16px;margin:8px 0;color:#0d0f1e}
.pteam h2{margin:2px 0;font-size:26px;color:#0d0f1e}
.pteam > div:last-child{color:#0d0f1e;font-weight:600}
.pemo{font-size:46px;background:#0d0f1e;border-radius:14px;width:72px;height:72px;display:grid;place-items:center;flex:none}
.pkick{font-family:'Press Start 2P';font-size:9px;letter-spacing:.5px}
.plbl{font-family:'Press Start 2P';font-size:10px;color:var(--muted);margin:6px 0 4px}
.pdet{background:#161a33;border:1px solid #2c3366;border-radius:12px;padding:10px 14px;margin:12px 0}
.pdet summary{font-weight:700;cursor:pointer}
.pdet ul{margin:8px 0 0;padding-left:18px}
.pability{background:#0d0f1e;border:2px dashed var(--c);border-radius:14px;padding:14px;margin:12px 0}
.pability b{font-family:'Press Start 2P';font-size:14px;color:var(--c);display:block;margin:6px 0}
.pability button{width:100%;margin-top:6px;background:var(--c);color:#0d0f1e;border:none;border-radius:10px;padding:13px;font-weight:800;font-size:16px}
.pability button.used{opacity:.6}
.pvote button{display:block;width:100%;text-align:left;background:#1d2244;border:2px solid var(--o);color:var(--text);border-radius:10px;padding:12px;margin:8px 0;font-size:15px}
.pvote button b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--o);color:#0d0f1e;margin-right:6px}
.pvote button.on{background:var(--o);color:#0d0f1e;font-weight:800}
.pvote button:disabled,.preacts button:disabled,.prate button:disabled,.pq:disabled{opacity:.35}
.preacts{display:flex;gap:8px;justify-content:space-between;margin:12px 0}
.preacts button{flex:1;font-size:26px;background:#161a33;border:1px solid #2c3366;border-radius:12px;padding:8px 0}
.preacts button:active{transform:scale(.9)}
.popt{display:flex;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.popt b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--o);color:#0d0f1e;display:grid;place-items:center}
.plink{display:block;margin:18px auto 0;background:none;border:none;color:var(--muted);text-decoration:underline;font-size:14px}
.pq{width:100%;background:var(--audit);color:#0d0f1e;border:none;border-radius:12px;padding:15px;font-size:17px;font-weight:800}
.prate{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #2c3366;font-weight:700}
.prate button{background:none;border:none;font-size:26px;color:#2c3366;padding:0 2px}
.prate button.on{color:#ffd75a}
.pfull{position:fixed;inset:0;z-index:50;background:rgba(5,6,15,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:10px}
.pfull div{font-size:80px}
.pfull small{font-family:'Press Start 2P';font-size:11px;color:var(--c)}
.pfull b{font-family:'Press Start 2P';font-size:24px;color:#fff;text-shadow:0 0 20px var(--c);line-height:1.4}
.pfull p{font-size:18px;max-width:420px}
.pfull em{color:var(--muted);font-size:13px}

.pchat .chatbox{max-height:300px;min-height:120px;overflow-y:auto;background:#0d0f1e;border:1px solid #2c3366;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.msg{display:flex;flex-direction:column;align-items:flex-start;max-width:85%}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg .who{font-size:11px;color:var(--muted);margin:0 4px 2px}
.msg .bub{background:#1d2244;border:1px solid #2c3366;border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:15px;word-break:break-word}
.msg.me .bub{background:var(--c);color:#0d0f1e;border-color:var(--c);border-radius:14px 14px 4px 14px;font-weight:600}
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;-webkit-overflow-scrolling:touch}
.quick button{flex:none;background:#1d2244;border:1px solid var(--c);color:var(--text);border-radius:99px;padding:6px 11px;font-size:13px;white-space:nowrap}
.quick button:disabled{opacity:.35}
.chatform{display:flex;gap:8px;margin-top:6px}
.chatform input{flex:1;min-width:0;background:#0d0f1e;border:1px solid #2c3366;border-radius:99px;padding:11px 14px;color:var(--text);font:inherit;font-size:16px}
.chatform input:focus{outline:none;border-color:var(--c)}
.chatform button{flex:none;width:46px;height:46px;border-radius:50%;border:none;background:var(--c);color:#0d0f1e;font-size:18px;font-weight:800}
.chatform button:disabled{opacity:.35}

/* phone diagnostics, portfolio, calls */
.pdiag{background:#2a1a12;border:1px solid #8a5e05;color:#ffd9a0;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.ppf{width:100%;margin:4px 0 10px;background:#e9d9a8;color:#3a2a10;border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:800;box-shadow:0 3px 0 #8a6a2a}
.pfphone{position:fixed;inset:0;z-index:60;background:#0d0f1e;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px 30px}
.pfp-top{display:flex;justify-content:space-between;align-items:center;font-family:'Press Start 2P';font-size:11px;color:var(--yield);margin-bottom:10px}
.pfp-top button{background:var(--bad);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:16px}
.pfp-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.pfp-tabs button{flex:none;background:var(--t);color:#1d1a14;border:none;border-radius:8px;padding:7px 10px;font-size:13px;font-weight:800;opacity:.45}
.pfp-tabs button.on{opacity:1;box-shadow:0 0 0 2px #fff}
.pfp-view{width:100%;overflow:hidden;border-radius:12px;border:7px solid #5c3417;background:#5c3417;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.pfp-stage{width:calc(100% * 100 / 38);container-type:inline-size}
.pfp-page{width:38cqw;min-height:48cqw;flex:none;border-radius:.4cqw;transform-origin:left center}
.pfp-page.next{animation:pnext .5s cubic-bezier(.3,.7,.3,1)}
.pfp-page.prev{animation:pprev .5s cubic-bezier(.3,.7,.3,1);transform-origin:right center}
@keyframes pnext{from{transform:perspective(900px) rotateY(-80deg);opacity:.2}}
@keyframes pprev{from{transform:perspective(900px) rotateY(80deg);opacity:.2}}
.pfp-nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.pfp-nav button{background:#e9d9a8;color:#1d1a14;border:none;border-radius:10px;padding:10px 16px;font-weight:800;font-size:15px}
.pfp-nav button:disabled{opacity:.3}
.pfp-nav span{color:#e9d9a8;font-weight:700}
.callbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 10px}
.cbtn{border:none;border-radius:99px;padding:10px 14px;font-weight:800;font-size:15px;background:#1d2244;color:var(--text);border:1px solid #2c3366}
.cbtn.call{background:#2bd46b;color:#06210f;border-color:#2bd46b}
.cbtn.hang{background:#ff4d4d;color:#fff;border-color:#ff4d4d}
.cbtn:disabled{opacity:.35}
.cstat{flex:1;font-size:14px;color:var(--muted);min-width:140px}
.cstat.live{color:#2bd46b}
.incoming{position:fixed;left:12px;right:12px;top:12px;z-index:70;background:#161a33;border:2px solid #2bd46b;border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:popin2 .3s ease}
@keyframes popin2{from{transform:translateY(-30px);opacity:0}}
.incoming .ring{font-size:40px;animation:ringing .5s infinite alternate}
@keyframes ringing{to{transform:rotate(-18deg) scale(1.1)}}
.incoming b{font-size:20px}
.incoming span{color:var(--muted);font-size:14px}
.incoming .ibtns{display:flex;gap:12px;margin-top:8px}
.incoming .cbtn{padding:12px 22px;font-size:16px}

}
function doSpin(){
  if(S.spinning) return;
  const lay=['yield','yield','image','image','impact','impact'];
  for(let i=lay.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [lay[i],lay[j]]=[lay[j],lay[i]]; }
  S.spinLayout=lay; S.spinDone=false; render();
  const g=$('#wheelG'); if(!g) return;
  S.spinning=true;
  S.spinRot += 360*6 + Math.floor(Math.random()*6)*60;
  g.style.transition='transform 5.2s cubic-bezier(.12,.62,.08,1)';
  requestAnimationFrame(()=>{ g.style.transform=`rotate(${S.spinRot}deg)`; });
  let t=0; const tick=()=>{ blip(700+Math.random()*300); t++; const d=40+t*t*1.6; if(d<700) setTimeout(tick,d); }; tick();
  setTimeout(()=>{ S.spinning=false; S.spinDone=true; alarmSound(); render(); }, 5400);

async function getDB(){
  if(window.__ccdbMock){ FB.status='ok'; return window.__ccdbMock; }
  if(!FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.projectId){ FB.status='noconfig'; return null; }
  FB.status='loading';
  if(getDB.p) return getDB.p;
  getDB.p = (async()=>{
    const V='10.12.2';
    const app = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const fs  = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const d = fs.initializeFirestore(app.initializeApp(FIREBASE_CONFIG), {experimentalForceLongPolling:true});
    FB.status='ok';
    const W = sn=>({id:sn.id, exists:sn.exists(), data:()=>sn.data()});
    return {
      doc:path=>{ const r=fs.doc(d,path); return {
        get:async()=>W(await fs.getDoc(r)),
        set:data=>fs.setDoc(r,data),
        onSnapshot:(next,err)=>fs.onSnapshot(r,sn=>next(W(sn)),e=>{ FB.status='dberror'; FB.detail=e&&e.code||''; err&&err(e); }) }; },
      collection:path=>{ const r=fs.collection(d,path); return {
        onSnapshot:(next,err)=>fs.onSnapshot(r,qs=>next({docs:qs.docs.map(W), docChanges:()=>qs.docChanges().map(c=>({type:c.type,doc:W(c.doc)}))}),e=>{ FB.status='dberror'; FB.detail=e&&e.code||''; err&&err(e); }) }; }
    };
  })().catch(e=>{ console.warn('Firebase not available',e); FB.status='sdkfail'; FB.detail=String(e&&e.message||e); return null; });
  return getDB.p;
}

/* ============ PHONE: TEAM VOICE CALL (WebRTC, signaling via Firestore) ============ */
const ICE = {iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302','stun:stun2.l.google.com:19302']}]};
const C2 = {state:'idle', pc:null, stream:null, callId:null, peer:null, t0:0, muted:false, docs:{}, unsub:null, team:null, ring:null, err:'', pendingOffer:null};
function pMate(){ const seat=pMySeat(), seats=P.state?.seats||{}; if(!seat) return 'your teammate'; const t=PLAYERS.find(p=>p.id===seat).team; return seats[PLAYERS.find(p=>p.team===t&&p.id!==seat).id]||'your teammate'; }
function callAudio(){ let a=document.getElementById('callAudio'); if(!a){ a=document.createElement('audio'); a.id='callAudio'; a.autoplay=true; a.setAttribute('playsinline',''); document.body.appendChild(a); } return a; }
function callSync(){
  const team=pTeam(); if(!P.db || !team || team===C2.team) return;
  if(C2.unsub){ try{ C2.unsub(); }catch(_){} }
  C2.team=team; C2.docs={};
  C2.unsub=P.db.collection('call_'+team).onSnapshot(qs=>{ const m={}; qs.docs.forEach(d=>m[d.id]=d.data()); C2.docs=m; callOnDocs(); }, ()=>{});
}
function callOnDocs(){
  const ses=P.state?.session, o=C2.docs.offer, a=C2.docs.answer, e=C2.docs.end, ok=x=>x && x.session===ses;
  if(ok(e) && e.callId===C2.callId && C2.state!=='idle' && C2.state!=='incoming' && e.by!==P.me){ callCleanup('Call ended by '+e.by); return; }
  if(C2.state==='incoming' && ok(e) && C2.pendingOffer && e.callId===C2.pendingOffer.callId){ ringStop(); C2.state='idle'; C2.pendingOffer=null; C2.err='Missed call'; pRender(); return; }
  if(C2.state==='calling' && C2.pc && ok(a) && a.callId===C2.callId && a.from!==P.me){
    C2.state='connecting'; pRender();
    C2.pc.setRemoteDescription({type:'answer', sdp:a.sdp}).catch(()=>callCleanup('Connection failed')); return; }
  const fresh = ok(o) && o.from!==P.me && Date.now()-o.ts<60000 && !(ok(e) && e.callId===o.callId) && !(ok(a) && a.callId===o.callId) && o.callId!==C2.callId;
  if(fresh){
    if(C2.state==='calling'){ callCleanup(null,true); C2.pendingOffer=o; callAccept(); return; }   // both pressed call → just connect
    if(C2.state==='idle' && (!C2.pendingOffer || C2.pendingOffer.callId!==o.callId)){ C2.state='incoming'; C2.pendingOffer=o; C2.peer=o.from; C2.err=''; ringStart(false); pRender(); }
  }
}
function getMic(){ return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}, video:false}); }
function newPC(){
  const pc=new RTCPeerConnection(ICE);
  pc.ontrack=ev=>{ const au=callAudio(); au.srcObject=ev.streams[0]; au.play().catch(()=>{}); };
  pc.onconnectionstatechange=()=>{
    if(C2.pc!==pc) return;
    const s=pc.connectionState;
    if(s==='connected'){ C2.state='incall'; C2.t0=Date.now(); ringStop(); startCallTimer(); pRender(); }
    if(s==='failed') callHang('Connection failed — try being on the same wifi, or both on mobile data');
    if(s==='disconnected') setTimeout(()=>{ if(C2.pc===pc && pc.connectionState!=='connected') callHang('Call dropped'); },5000);
  };
  return pc;
}
function iceDone(pc){ return new Promise(res=>{ if(pc.iceGatheringState==='complete') return res(); const t=setTimeout(res,2500); pc.addEventListener('icegatheringstatechange',()=>{ if(pc.iceGatheringState==='complete'){ clearTimeout(t); res(); } }); }); }
async function callStart(){
  if(C2.state!=='idle' || !P.db || !P.state?.session) return;
  const team=pTeam(); C2.err='';
  try{ C2.stream=await getMic(); }catch(_){ C2.err='Microphone blocked — allow microphone access for this page in your browser settings'; pRender(); return; }
  C2.callId=Date.now()+'-'+KEY(P.me); C2.peer=pMate(); C2.state='calling'; pRender(); ringStart(true);
  const pc=C2.pc=newPC(); C2.stream.getTracks().forEach(t=>pc.addTrack(t,C2.stream));
  await pc.setLocalDescription(await pc.createOffer()); await iceDone(pc);
  if(C2.pc!==pc) return;
  P.db.doc('call_'+team+'/offer').set({callId:C2.callId, from:P.me, sdp:pc.localDescription.sdp, session:P.state.session, ts:Date.now()}).catch(()=>{});
  clearTimeout(C2.timeout); C2.timeout=setTimeout(()=>{ if(C2.state==='calling') callHang('No answer'); },45000);
}
async function callAccept(){
  const o=C2.pendingOffer; if(!o) return; ringStop(); const team=pTeam(); C2.err='';
  try{ C2.stream=await getMic(); }catch(_){ C2.err='Microphone blocked — allow microphone access for this page in your browser settings'; C2.state='idle'; pRender(); return; }
  C2.callId=o.callId; C2.peer=o.from; C2.state='connecting'; pRender();
  const pc=C2.pc=newPC(); C2.stream.getTracks().forEach(t=>pc.addTrack(t,C2.stream));
  try{
    await pc.setRemoteDescription({type:'offer', sdp:o.sdp});
    await pc.setLocalDescription(await pc.createAnswer()); await iceDone(pc);
  }catch(_){ callHang('Connection failed'); return; }
  if(C2.pc!==pc) return;
  P.db.doc('call_'+team+'/answer').set({callId:o.callId, from:P.me, sdp:pc.localDescription.sdp, session:P.state.session, ts:Date.now()}).catch(()=>{});
}
function callEndDoc(id){ if(id && P.db && P.state?.session) P.db.doc('call_'+pTeam()+'/end').set({callId:id, by:P.me, session:P.state.session, ts:Date.now()}).catch(()=>{}); }
function callDecline(){ const o=C2.pendingOffer; ringStop(); C2.state='idle'; if(o) callEndDoc(o.callId); pRender(); }
function callHang(msg){ callEndDoc(C2.callId); callCleanup(msg); }
function callCleanup(msg, silent){
  clearTimeout(C2.timeout); clearInterval(C2.tick); ringStop();
  try{ C2.pc && C2.pc.close(); }catch(_){}
  try{ C2.stream && C2.stream.getTracks().forEach(t=>t.stop()); }catch(_){}
  const au=document.getElementById('callAudio'); if(au) au.srcObject=null;
  Object.assign(C2,{state:'idle', pc:null, stream:null, callId:null, muted:false});
  C2.err = msg||''; if(!silent) pRender();
}
function callMute(){ C2.muted=!C2.muted; if(C2.stream) C2.stream.getAudioTracks().forEach(t=>t.enabled=!C2.muted); pRender(); }
const callElapsed = ()=>{ const s=Math.max(0,Math.floor((Date.now()-C2.t0)/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
function startCallTimer(){ clearInterval(C2.tick); C2.tick=setInterval(()=>{ const el=document.getElementById('callTime'); if(el) el.textContent=callElapsed(); },1000); }
let ringCtx=null;
function ringStart(outgoing){
  ringStop(); try{ ringCtx = ringCtx || new (window.AudioContext||window.webkitAudioContext)(); }catch(_){ return; }
  const beep=()=>{ try{ const o=ringCtx.createOscillator(), g=ringCtx.createGain(); o.frequency.value=outgoing?440:660; g.gain.value=.05; o.connect(g); g.connect(ringCtx.destination); o.start(); o.stop(ringCtx.currentTime+.35); }catch(_){}
    if(!outgoing && navigator.vibrate){ try{ navigator.vibrate([200,100,200]); }catch(_){} } };
  beep(); C2.ring=setInterval(beep, outgoing?2500:1300);
}
function ringStop(){ clearInterval(C2.ring); C2.ring=null; }
function callBarHTML(){
  const can = P.live && P.state?.session && window.RTCPeerConnection && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
  const mate=esc(pMate()); let inner='';
  if(C2.state==='idle')       inner=`<button class="cbtn call" data-p="call" ${can?'':'disabled'}>📞 Call ${mate}</button>`;
  if(C2.state==='calling')    inner=`<span class="cstat">📞 Calling ${esc(C2.peer||mate)}…</span><button class="cbtn hang" data-p="hang">✖ Cancel</button>`;
  if(C2.state==='connecting') inner=`<span class="cstat">🔄 Connecting…</span><button class="cbtn hang" data-p="hang">✖</button>`;
  if(C2.state==='incoming')   inner=`<span class="cstat">📞 ${esc(C2.peer)} is calling…</span>`;
  if(C2.state==='incall')     inner=`<span class="cstat live">🔊 Talking with ${esc(C2.peer)} · <b id="callTime">${callElapsed()}</b></span><button class="cbtn" data-p="mute">${C2.muted?'🔇 Unmute':'🎙 Mute'}</button><button class="cbtn hang" data-p="hang">📴 End</button>`;
  return `<div class="callbar">${inner}</div>${C2.err?`<div class="pmuted" style="margin:6px 2px 0">ℹ️ ${esc(C2.err)}</div>`:''}${can||C2.state!=='idle'?'':'<div class="pmuted" style="margin-top:6px">Calls need the live connection.</div>'}`;
}
function incomingHTML(){
  if(C2.state!=='incoming') return '';
  return `<div class="incoming"><div class="ring">📞</div><b>${esc(C2.peer)}</b><span>is calling you · team call</span>
    <div class="ibtns"><button class="cbtn hang" data-p="decline">Decline</button><button class="cbtn call" data-p="accept">Accept</button></div></div>`;
}

async function phoneInit(){
  document.documentElement.classList.add('phonemode'); document.body.classList.add('phonemode'); pRender();
  try{
    P.db = await getDB();
    if(!P.db){ pRender(); return; }
    setTimeout(()=>{ if(!P.live && FB.status==='ok'){ FB.status='timeout'; pRender(); } },10000);
    P.db.doc('game/state').onSnapshot(sn=>{
      P.live=true; P.state=sn.exists?sn.data():null;
      if(P.me && P.state && P.mine.session!==P.state.session){ P.mine={}; P.chatTeam=null; C2.team=null; if(C2.state!=='idle') callCleanup(null,true); pWrite({joinedAt:Date.now()}); }
      pRender();
    }, ()=>{ P.live=false; pRender(); });
    pRender();
  }catch(_){ pRender(); }
}

function figure(id, shirt, badge){
  const L=lookFor(id);
  const hair = L.style==='long'?`<div class="hair long-fringe"></div>`:L.style==='bun'?`<div class="hair short"></div><div class="hair bun"></div>`:`<div class="hair short"></div>`;
  return `<div class="fig" style="--skin:${L.skin};--hair:${L.hair};--shirt:${shirt}">${L.style==='long'?'<div class="hairback"></div>':''}<div class="head">${hair}<i class="eye l"></i><i class="eye r"></i><i class="mouth"></i>${L.glasses?'<i class="glasses"></i>':''}</div><div class="body">${badge}</div></div>`;
}
const pos=(ang,f)=>{const a=ang*Math.PI/180; return {x:TABLE.cx+TABLE.rx*f*Math.cos(a), y:TABLE.cy+TABLE.ry*f*Math.sin(a)};};

/* ============ RENDER ============ */
function render(){
  if(S.flipping||S.spinning) return;
  const c=C(), o=S.winner?c.options[S.winner]:null, B=esc(S.bank), ph=PH();
  const talking=S.speech?.id;
  const focus = S.activePitch ? PLAYERS.filter(p=>p.team===S.activePitch).map(p=>p.id) : S.focus;

  const seats = PLAYERS.map(p=>{
    const {x,y}=pos(SEAT_ANGLE[p.id],1.12), col=tc(p.team);
    const lead=['p1','p3','p5'].includes(p.id);
    const hud = S.huddle ? (p.team==='image' ? (lead?'huddle-r':'huddle-l') : (lead?'huddle-l':'huddle-r')) : '';
    const cls=[talking===p.id||S.activePitch===p.team?'talking':'', focus&&!focus.includes(p.id)?'dim':'', hud].join(' ');

  }).join('');

  const COINX={A:36,B:50,C:64};
  const coins=Object.keys(S.votes).map(k=>{ if(!S.votes[k] && PH()!=='vote') return '';
    return `<div class="coins" style="left:${COINX[k]}%;top:41%">${'<i></i>'.repeat(S.votes[k])}<b class="coinlbl" style="color:${oc(k)}">${k}${S.votes[k]?' · '+S.votes[k]:''}</b></div>`;}).join('');

  const qbar=PHASES.map((_,i)=>`<i class="${i<=S.phase?'on':''}"></i>`).join('');

    if(S.holo==='ecg') holo=`<div class="holo"><div class="htitle">🧭 ECONOMY FOR THE COMMON GOOD · BALANCE</div><div class="ecg">
       ${o.pos.length?o.pos.map((p,i)=>`<div class="r" style="animation-delay:${i*.4}s"><span>✚ ${p[0]}</span><b class="t-impact">+${p[1]}</b></div>`).join(''):`<div class="r"><span style="color:var(--muted)">No positive points earned</span><b>0</b></div>`}
       ${o.neg.map(n=>`<div class="r neg" style="animation-delay:.9s"><span>✖ ${n[0]}</span><span>${n[1]}</span></div>`).join('')}
       <div class="r tot" style="animation-delay:1.4s"><span>TOTAL</span><span style="color:${tot<0?'var(--bad)':'var(--impact)'}">${tot>0?'+':''}${tot}</span></div></div>
       ${o.neg.length&&o.pos.length?`<div class="warnbox">⚠ +${pp} charity does <b>not</b> cancel ${neg}. A donation cannot buy back structural harm.</div>`:''}

function flipTo(n){
  n=+n; if(S.flipping || n<0 || n>=PF_PAGES.length) return;
  if(S.pf===null || !$('#pf')){ S.pf=n; S.pfAnim=true; render(); S.pfAnim=false; pageSound(); return; }
  const cur=S.pf; if(n===cur) return;
  const fwd=n>cur, [cL,cR]=spread(cur), [nL,nR]=spread(n), pf=$('#pf');
  S.flipping=true; pageSound();
  const f=document.createElement('div');
  f.className='flipper '+(fwd?'fwd':'bwd');
  f.innerHTML = fwd ? `<div class="face front page r">${cR}</div><div class="face back page l">${nL}</div>`
                    : `<div class="face front page l">${cL}</div><div class="face back page r">${nR}</div>`;
  pf.appendChild(f);
  if(fwd) $('#pgR').innerHTML=nR; else $('#pgL').innerHTML=nL;
  requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.add('go')));
  setTimeout(()=>{ S.flipping=false; S.pf=n; render(); }, 820);
}
function pageSound(){
  if(S.mute||!actx) return;
  try{ const len=actx.sampleRate*.25, buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2)*.5;
    const s=actx.createBufferSource(), f=actx.createBiquadFilter(), g=actx.createGain(); f.type='bandpass'; f.frequency.value=1800; g.gain.value=.25;
    s.buffer=buf; s.connect(f); f.connect(g); g.connect(actx.destination); s.start(); }catch(_){}
}

function matrix(c,win){
  const W=360,pad=34,sc=v=>pad+(v+100)/200*(W-2*pad),sy=v=>W-sc(v);
  const q=(x,y,t,col)=>`<text x="${x}" y="${y}" fill="${col}" font-size="12" font-weight="700" text-anchor="middle" opacity=".8">${t}</text>`;
  const pts=Object.entries(c.options).map(([k,o])=>{const w=k===win,x=sc(o.sv),y=sy(o.soc);
    return `<g opacity="${w?1:.45}">${w?`<circle cx="${x}" cy="${y}" r="20" fill="none" stroke="${oc(k)}" stroke-width="2"><animate attributeName="r" values="12;26;12" dur="1.6s" repeatCount="indefinite"/></circle>`:''}<circle cx="${x}" cy="${y}" r="${w?11:8}" fill="${oc(k)}" stroke="#0d0f1e" stroke-width="2"/><text x="${x}" y="${y+(o.soc>60?24:-16)}" fill="${oc(k)}" font-size="13" font-weight="700" text-anchor="middle">Option ${k}</text></g>`;}).join('');
  return `<svg viewBox="0 0 ${W} ${W}" style="height:21cqw;width:auto;display:block;margin:auto" font-family="Space Grotesk">
   <rect x="${pad}" y="${pad}" width="${W/2-pad}" height="${W/2-pad}" fill="#ff6fa5" opacity=".1"/><rect x="${W/2}" y="${pad}" width="${W/2-pad}" height="${W/2-pad}" fill="#46e39a" opacity=".12"/>
   <rect x="${pad}" y="${W/2}" width="${W/2-pad}" height="${W/2-pad}" fill="#9aa1d0" opacity=".08"/><rect x="${W/2}" y="${W/2}" width="${W/2-pad}" height="${W/2-pad}" fill="#f5b83d" opacity=".1"/>
   <line x1="${pad}" y1="${W/2}" x2="${W-pad}" y2="${W/2}" stroke="#2c3366" stroke-width="2"/><line x1="${W/2}" y1="${pad}" x2="${W/2}" y2="${W-pad}" stroke="#2c3366" stroke-width="2"/>
   ${q(W/4+pad/2,pad+16,'CHARITY','#ff6fa5')}${q(3*W/4-pad/2,pad+16,'SHARED VALUE','#46e39a')}${q(W/4+pad/2,W-pad-8,'COMPLIANCE','#9aa1d0')}${q(3*W/4-pad/2,W-pad-8,'SHAREHOLDER','#f5b83d')}
   <text x="${W/2}" y="${W-6}" fill="#9aa1d0" font-size="12" text-anchor="middle">Shareholder value added →</text>
   <text x="12" y="${W/2}" fill="#9aa1d0" font-size="12" text-anchor="middle" transform="rotate(-90 12 ${W/2})">Societal value added →</text>${pts}</svg>`;
}
function menuHTML(){
  return `<div class="over" data-a="closeOver"><div class="panelbox" data-stop>
   <h2>⚙ SETUP</h2><div class="fgrid"><label>Bank in the case study<input data-bank value="${esc(S.bank)}"></label></div>
   <h3>🎡 Players in the Lucky Spin</h3>
   <div class="fgrid">${S.students.map((n,k)=>`<label>Player ${k+1}<input data-student="${k}" value="${esc(n)}"></label>`).join('')}</div>
   <h3>🔍 Audit team</h3>
   <div class="fgrid">${AUDITORS.map(a=>`<label><span style="color:var(--audit)">${a.emoji} ${a.name}</span><input data-name="${a.id}" value="${esc(S.names[a.id]||'')}"></label>`).join('')}</div>
   <h3>🪑 Seats at the table (filled by the spin — editable)</h3>
   <div class="fgrid">${PLAYERS.map(p=>`<label><span style="color:${tc(p.team)}">${TEAMS[p.team].emoji} ${TEAMS[p.team].name} · ${p.title}</span><input data-name="${p.id}" value="${esc(S.names[p.id]||'')}" placeholder="after spin"></label>`).join('')}</div>
   <div style="text-align:right;margin-top:1.4cqw"><button class="start" style="font-size:1.1cqw" data-a="closeOver">✔ Back to the game</button></div></div></div>`;
}
function profileHTML(id){
  const p=PLAYERS.find(x=>x.id===id), a=AUDITORS.find(x=>x.id===id), col=colorOf(id);
  const pic=`<div class="pp" style="--c:${col}">${figure(id,p?tc(p.team):'#3b6fd1',(p||a).emoji)}</div>`;
  const body=p?`<div style="font-family:'Press Start 2P';font-size:.9cqw;color:${col}">${TEAMS[p.team].emoji} ${TEAMS[p.team].name.toUpperCase()} · TOP SECRET</div>
     <h2 style="color:var(--text);margin:.6cqw 0 .2cqw;font-family:'Space Grotesk';font-size:2.2cqw">${esc(pname(p.id))}</h2><div style="color:var(--muted)">${p.title} · ${p.cls} · Teammate: <b>${esc(pname(PLAYERS.find(q=>q.team===p.team&&q.id!==p.id).id))}</b></div>
     ${Object.entries(p.stats).map(([n,v])=>`<div class="stat"><span>${n}</span><div class="sbar"><i style="width:${v*10}%;background:${col}"></i></div><b>${v}</b></div>`).join('')}
     <div class="abil" style="--c:${col}"><b style="font-family:'Press Start 2P';font-size:.85cqw;color:${col}">⚡ ${p.ability.name}</b><br>${p.ability.text}</div>
     <div class="lbl">TEAM MISSION (shared)</div>${p.agenda}<div class="lbl">WIN CONDITION</div>🏆 ${p.win}
     <div class="lbl">ARGUMENTS</div><ul class="cl">${p.lines.map(l=>`<li>${l}</li>`).join('')}</ul>`
   :`<div style="font-family:'Press Start 2P';font-size:.9cqw;color:var(--audit)">AUDITOR</div><h2 style="color:var(--text);margin:.6cqw 0 .2cqw;font-family:'Space Grotesk';font-size:2.2cqw">${a.name} · ${esc(S.names[a.id]||'')}</h2><div style="color:var(--muted)">${a.title}</div>
     <div class="abil" style="--c:var(--audit)"><b style="font-family:'Press Start 2P';font-size:.85cqw;color:var(--audit)">POWER</b><br>${a.power}</div>
     <div class="lbl">DUTIES</div><ul class="cl">${a.duties.map(d=>`<li><b>${d[0]}:</b> ${d[1]}</li>`).join('')}</ul>
     <div class="lbl">SCRIPT</div><ul class="cl">${a.script.map(s=>`<li><i>${s}</i></li>`).join('')}</ul>`;
  const sayBtn = p ? `<button class="sbtn" data-a="sayLine" data-x="${id}">💬 Say a line at the table</button>` : `<button class="sbtn" data-a="sayLine" data-x="${id}">💬 Say a script line</button>`;
  return `<div class="over" data-a="closeOver"><div class="panelbox" data-stop style="width:62cqw"><div class="prof">${pic}<div style="flex:1">${body}</div></div>
   <div style="display:flex;justify-content:space-between;margin-top:1.2cqw">${sayBtn}<button class="start" style="font-size:1.1cqw" data-a="closeOver">✔ Close</button></div></div></div>`;
}

/* ============ ACTIONS ============ */
const REACTS={A:{p1:'😎',p2:'🤑',p3:'😬',p4:'😬',p5:'😡',p6:'😡'},B:{p1:'🤷',p2:'🤷',p3:'😅',p4:'😅',p5:'🙄',p6:'🙄'},C:{p1:'😱',p2:'😱',p3:'😮',p4:'😮',p5:'🎉',p6:'🎉'}};
let reactTimer=null;
function setReact(map, ms){ S.react=map; clearTimeout(reactTimer); if(ms) reactTimer=setTimeout(()=>{S.react=null; render();},ms); }
function setPhase(i){
  if(typeof i==='string' && isNaN(i)) i=PHASES.findIndex(p=>p.id===i);
  S.phase=+i; const p=PHASES[S.phase];
  S.pf=null; S.alarm=false; S.focus=null; S.ability=null; S.dq=null; S.speech=null; S.react=null;
  if(p.id!=='strategy') S.huddle=false;
  if(p.id!=='pitch') S.activePitch=null;
  if(p.id!=='verdict') S.holo=null;
  if(p.t) timerSet(p.t);
  if(p.id==='dilemma' && !S.caseChosen) S.caseChosen=true;
}
function resetRound(){ Object.assign(S,{pitched:{},activePitch:null,votes:{A:0,B:0,C:0},winner:null,tie:false,holo:null,speech:null,react:null,ability:null,huddle:false,alarm:false,pf:null,dq:null,focus:null}); }

function act(a,x){
  if(S.flipping||S.spinning) return;
  const c=C();
  switch(a){
    case 'start': S.title=false; unlockAudio(); setPhase('spin'); break;
    case 'menu': S.overlay='menu'; break;
    case 'join': S.overlay='join'; break;
    case 'usePhone': S.votes={...phoneVotes().c}; S.tie=false; blip(1200); break;
    case 'ratings': S.holo = S.holo==='ratings'?null:'ratings'; break;
    case 'spin': doSpin(); return;
    case 'seat': seatEveryone(); setPhase('prologue'); setReact(Object.fromEntries(PLAYERS.map(p=>[p.id,'👋'])),3000); say('a1',`Everyone is seated! <b>${S.names.p1} & ${S.names.p2}</b> · <b>${S.names.p3} & ${S.names.p4}</b> · <b>${S.names.p5} & ${S.names.p6}</b>. Welcome to the council.`); break;
    case 'closeOver': S.overlay=null; S.profile=null; break;
    case 'fs': try{ document.fullscreenElement?document.exitFullscreen():$('#stage').requestFullscreen(); }catch(_){} return;
    case 'mute': S.mute=!S.mute; break;
    case 'phase': setPhase(x); break;
    case 'say': { const l=line(x); say(l[0],l[1]); S.focus=null; break; }
    case 'sayLine': { const w=who(x), src=w.lines||w.script; S.profile=null; say(x, src[Math.floor(Math.random()*src.length)]); break; }
    case 'clearSpeech': S.speech=null; break;
    case 'clearAbility': S.ability=null; break;
    case 'clearAll': S.speech=null; S.react=null; S.ability=null; S.holo=null; S.pf=null; S.alarm=false; S.focus=null; S.dq=null; break;
    case 'react': { const m={}; [...PLAYERS,...AUDITORS].forEach(p=>m[p.id]=x); setReact(m,4000); blip(900); break; }
    case 'pfToggle': if(S.pf===null){ S.speech=null; flipTo(0); return; } S.pf=null; break;
    case 'pfOpen': setPhase('dilemma'); S.speech=null; render(); flipTo(0); return;
    case 'pf': S.caseChosen=true; if(PH()==='prologue'||PH()==='spin'){ setPhase('dilemma'); render(); } S.speech=null; flipTo(x); return;
    case 'pfclose': S.pf=null; break;
    case 'alarm': S.alarm=!S.alarm; if(S.alarm){ alarmSound(); setReact({p1:'😰',p2:'😰',p3:'😱',p4:'😱',p5:'👀',p6:'👀'},5000); S.speech={id:'a1',text:C().pressure}; } else S.speech=null; break;
    case 'huddle': S.huddle=!S.huddle; S.speech=null; break;
    case 'timerSet': timerSet(+x); timerStart(); S.huddle=true; break;
    case 'timer': if(x==='go') timerToggle(); if(x==='reset') timerSet(T.base); if(x==='plus'){T.left+=30;} break;
    case 'timeup': timerPause(); alarmSound(); { const l=line('timeup'); say(l[0],l[1]); } setPhase('pitch'); S.speech={id:'a1',text:line('timeup')[1]}; break;
    case 'floor': if(S.activePitch && S.activePitch!==x) S.pitched[S.activePitch]=true; S.activePitch=x; timerSet(120); timerStart(); say('a1',`<b>${TEAMS[x].name}</b>, the floor is yours — <b>2 minutes</b>!`); break;
    case 'pitchDone': S.pitched[S.activePitch]=true; S.activePitch=null; timerPause(); setReact(Object.fromEntries(PLAYERS.map(p=>[p.id,'👏'])),2500); break;
    case 'ability': S.ability=x; blip(1300); setTimeout(()=>blip(1600),120); break;
    case 'vote': { const [k,d]=x.split(':'), tot=Object.values(S.votes).reduce((s,v)=>s+v,0); if(+d>0&&tot>=6) break; S.votes[k]=Math.max(0,S.votes[k]+(+d)); S.tie=false; if(+d>0) blip(1200); break; }
    case 'resetVotes': S.round++; S.votes={A:0,B:0,C:0}; S.tie=false; break;
    case 'lock': { const m=Math.max(...Object.values(S.votes)), lead=Object.keys(S.votes).filter(k=>S.votes[k]===m);
      if(lead.length===1){ S.winner=lead[0]; timerPause(); setPhase('verdict'); const l=line('decided'); say(l[0],l[1]); }
      else { S.tie=true; say('a1','A tie! As Chair, I break it — and I must justify my choice in one sentence.'); } break; }
    case 'consensus': S.winner=x; S.tie=false; timerPause(); setPhase('verdict'); setReact(Object.fromEntries(PLAYERS.map(p=>[p.id,'🤝'])),2500); { const l=line('decided'); say(l[0],l[1]); } break;
    case 'tie': S.winner=x; S.tie=false; setPhase('verdict'); { const l=line('decided'); say(l[0],l[1]); } break;
    case 'reveal': {
      const o=c.options[S.winner]; S.holo=x||null; if(!x){ S.speech=null; break; }
      const pp=sumPts(o.pos), neg=sumPts(o.neg), tot=pp+neg;
      if(x==='money') say('a2',o.ledger);
      if(x==='news') say('a2','And this is tomorrow’s front page…');
      if(x==='matrix') say('a3',`The CSR matrix: ${o.compass}`);
      if(x==='ecg') say('a3', o.neg.length&&o.pos.length?`Charity earns <b>+${pp}</b>, but the negative criterion costs <b>${neg}</b>. A donation cannot buy back structural harm. Total: <b>${tot}</b>.`: o.neg.length?`No positive points — and the negative criterion costs <b>${neg}</b>. Total: <b>${tot}</b>.`:`No negative criteria triggered. Total: <b>+${tot}</b>.`);
      if(x==='stamp'){ say('a1',`The auditors’ verdict: <b>${o.stamp}</b>.`); setReact(REACTS[S.winner],0); setTimeout(alarmSound,150); }
      if(x==='compare') say('a3','For the record — what the other two paths would have scored.');
      break; }
    case 'dq': { const q=DEBRIEF[+x]; S.dq=+x; S.focus=q[0]?[q[0],q[1]]:null; say('a3',q[2]); break; }
    case 'newRound': S.round++; resetRound(); setPhase('prologue'); break;
    case 'home': S.round++; resetRound(); S.title=true; S.phase=0; break;
  }
  render(); syncState();
}

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{
  if(PHONE()) return;
  const t=e.target;
  const btn=t.closest('[data-a]');
  if(t.closest('[data-stop]') && !(btn && btn.closest('[data-stop]'))) return;
  if(btn){ act(btn.dataset.a, btn.dataset.x); return; }
  const pr=t.closest('[data-prof]'); if(pr){ S.profile=pr.dataset.prof; render(); }
});
document.addEventListener('input',e=>{
  if(e.target.dataset.name!==undefined) S.names[e.target.dataset.name]=e.target.value;
  if(e.target.dataset.student!==undefined) S.students[+e.target.dataset.student]=e.target.value;
  if(e.target.dataset.bank!==undefined) S.bank=e.target.value||'The Bank';
});
document.addEventListener('keydown',e=>{
  if(PHONE()) return;
  if(e.target.tagName==='INPUT') return;
  if(e.key==='Escape'){ if(S.overlay||S.profile) act('closeOver'); else act('clearAll'); return; }
  if(S.title){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); act('start'); } return; }
  if(S.pf!==null && e.key==='ArrowRight') return flipTo(S.pf+1);
  if(S.pf!==null && e.key==='ArrowLeft') return flipTo(S.pf-1);
  if(e.key==='t'||e.key==='T') act('timer','go');
  if(/^[1-8]$/.test(e.key)) act('phase',+e.key-1);
});

/* ============ TIMER & SOUND ============ */
let T={left:0,base:0,run:false,id:null}, actx=null;
function unlockAudio(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); }catch(_){} }
function blip(f=520){ if(S.mute||!actx) return; try{ const o=actx.createOscillator(),g=actx.createGain(); o.type='square'; o.frequency.value=f; g.gain.value=.03; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+.06);}catch(_){} }
function alarmSound(){ for(let i=0;i<3;i++) setTimeout(()=>blip(880),i*250); }
function fmt(s){ const n=s<0; s=Math.abs(s); return (n?'-':'')+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function drawTimer(){ const w=$('#wall'); if(w){ w.textContent=fmt(T.left); w.className='cl'+(T.left<0?' over':T.left<=30&&T.base?' warn':''); } }
function timerSet(s){ clearInterval(T.id); T={left:s,base:s,run:false,id:null}; drawTimer(); }
function timerStart(){ if(T.run) return; T.run=true; T.id=setInterval(()=>{ T.left--; if(T.left===0) alarmSound(); drawTimer(); },1000); }
function timerPause(){ clearInterval(T.id); T.run=false; }
function timerToggle(){ T.run?timerPause():timerStart(); }

if(PHONE()) phoneInit(); else { render(); hostInit(); }
window.addEventListener('hashchange',()=>{ if(PHONE()) phoneInit(); else { document.documentElement.classList.remove('phonemode'); document.body.classList.remove('phonemode'); render(); } });
</script>
